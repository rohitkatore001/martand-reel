<!doctype html>
<html><head><meta charset="utf-8"><title>Martand Farsan reel</title></head>
<body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="deva.js"></script>
<script src="text.js"></script>
<script src="strings.js"></script>
<script src="encoder.js"></script>
<script>
// ?mode=test -> testclip.js ; ?mode=reel -> timeline.js, art.js, pack.js, audio.js, scenes.js (they must set window.REEL)
(async () => {
  try {
    const mode = new URLSearchParams(location.search).get('mode') || 'reel';
    const files = mode === 'test' ? ['testclip.js'] : ['timeline.js', 'art.js', 'pack.js', 'audio.js', 'scenes.js'];
    await Text.init();
    for (const f of files) {
      await new Promise((ok, bad) => {
        const s = document.createElement('script');
        s.src = f + '?v=' + Date.now();
        s.onload = ok; s.onerror = () => bad(new Error('cannot load ' + f));
        document.body.appendChild(s);
      });
    }
    if (window.REEL && window.REEL.init) await window.REEL.init();
    if (!window.REEL) throw new Error('no window.REEL defined by ' + files.join(', '));
    window.__ready = true;
  } catch (e) {
    window.__error = String(e && e.stack || e);
  }
})();
</script>
</body></html>
